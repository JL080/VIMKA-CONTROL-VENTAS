<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIMKA Inmobiliaria — Nos mudamos</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:32px;
    font-family:'Segoe UI',Inter,system-ui,-apple-system,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 85% 15%,rgba(151,201,58,.14),transparent 32rem),
      radial-gradient(circle at 15% 85%,rgba(151,201,58,.10),transparent 34rem),
      linear-gradient(160deg,#0B1F23 0%,#102A30 55%,#0B1F23 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.10) 1.4px,transparent 1.4px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse 60% 55% at 8% 8%,#000 0%,transparent 70%);
    mask-image:radial-gradient(ellipse 60% 55% at 8% 8%,#000 0%,transparent 70%);
  }

  .card{
    position:relative;z-index:1;
    width:min(720px,100%);
    text-align:center;
    padding:56px 48px 44px;
    background:rgba(20,45,50,.5);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    border:1px solid rgba(151,201,58,.20);
    border-radius:24px;
    box-shadow:0 24px 70px rgba(0,0,0,.35);
  }

  .logo-mark{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:34px;margin-bottom:14px}
  .logo-mark i{display:block;width:9px;border-radius:3px;background:linear-gradient(180deg,#c3e77b,#97C93A)}
  .logo-mark i:nth-child(1){height:38%}
  .logo-mark i:nth-child(2){height:60%}
  .logo-mark i:nth-child(3){height:80%}
  .logo-mark i:nth-child(4){height:100%}
  .logo-word{font-size:40px;font-weight:900;letter-spacing:1px;color:#fff;line-height:1}
  .logo-sub{margin-top:6px;font-size:13px;font-weight:700;letter-spacing:7px;color:#97C93A}

  .headline{
    margin:38px 0 14px;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;
    padding:20px 18px;
    border:1px solid rgba(151,201,58,.35);
    border-radius:18px;
    background:rgba(151,201,58,.05);
  }
  .headline h1{
    font-size:clamp(34px,6vw,54px);
    font-weight:900;letter-spacing:-1px;line-height:1;
    white-space:nowrap;
  }
  .headline h1 span{color:#97C93A}

  .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 26px}
  .divider .line{width:70px;height:2px;background:rgba(151,201,58,.45)}
  .divider .pin{width:26px;height:26px;color:#97C93A;flex:none}

  .tagline{color:#B2C4C7;font-size:15.5px;line-height:1.6;max-width:480px;margin:0 auto 34px}

  .cta{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:420px;
    padding:19px 30px;
    border-radius:999px;
    background:#97C93A;
    color:#0E2A2E;
    font-size:17px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    text-decoration:none;
    box-shadow:0 14px 30px rgba(151,201,58,.30);
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
  }
  .cta:hover{
    background:#a9dc4e;
    transform:translateY(-2px);
    box-shadow:0 0 0 5px rgba(151,201,58,.16),0 18px 38px rgba(151,201,58,.42);
  }
  .cta svg{width:19px;height:19px;flex:none}

  .credentials-note{
    margin-top:20px;
    color:#B2C4C7;
    font-size:13.5px;
    letter-spacing:.2px;
  }
  .credentials-note strong{color:#fff;font-weight:700}

  @media(max-width:520px){
    .card{padding:40px 24px 34px;border-radius:20px}
    .headline{flex-direction:column;gap:6px;padding:16px}
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo-mark"><i></i><i></i><i></i><i></i></div>
    <div class="logo-word">VIMKA</div>
    <div class="logo-sub">INMOBILIARIA</div>

    <div class="headline"><h1>NOS <span>MUDAMOS</span></h1></div>

    <div class="divider">
      <span class="line"></span>
      <svg class="pin" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
      <span class="line"></span>
    </div>

    <p class="tagline">Ya tenemos nuestro nuevo sistema, con una mejor experiencia para ti. Haz clic en el botón para ingresar.</p>

    <a class="cta" href="https://erp-vimka.vercel.app/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
      ERP VIMKA INMOBILIARIA
    </a>

    <p class="credentials-note">Pide tus nuevas credenciales <strong>con los encargados</strong>.</p>
  </div>

</body>
</html>
